version: "3.9"

services:
  backend:
    image: node-backend:latest
    container_name: node-backend
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${DB_URL}
      FLASK_API_BASE: ${FLASK_API_BASE}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - judge_net

    server:
      image: flas-backend:latest
      container_name: flask-server
      restart: always
      command: python -m workers.server
      env_file:
        - .env
      environment:
        PYTHONPATH: ${PYTHONPATH}
        HOST_MACHINE_BASE_DIR: ${HOST_MACHINE_BASE_DIR}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_BROKER_URL: ${REDIS_BROKER_URL}
        REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
        BACKEND_HOST: ${BACKEND_HOST}
        BACKEND_PORT: ${BACKEND_PORT}
        BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      networks:
        - judge_net

    worker:
      image: maitreya16/rc-flask-backend:latest
      container_name: flask-worker
      restart: always
      command: >
        celery -A workers.tasks worker
        --loglevel=${LOG_LEVEL}
        --concurrency=${WORKER_CONCURRENCY}
        --queues=${WORKER_QUEUES}
      depends_on:
        - redis
      env_file:
        - .env
      environment:
        PYTHONPATH: ${PYTHONPATH}
        HOST_MACHINE_BASE_DIR: ${HOST_MACHINE_BASE_DIR}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_BROKER_URL: ${REDIS_BROKER_URL}
        REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
        BACKEND_HOST: ${BACKEND_HOST}
        BACKEND_PORT: ${BACKEND_PORT}
        BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      working_dir: /app
      volumes:
        - ./submissions:/app/submissions:z
        - /var/run/docker.sock:/var/run/docker.sock
      networks:
        - judge_net

    redis:
      image: redis:latest
      container_name: my-redis
      ports:
        - "${REDIS_PORT}:6379"
      volumes:
        - redisdata:/data
      networks:
        - judge_net

  networks:
    judge_net:

  volumes:
    redisdata:
